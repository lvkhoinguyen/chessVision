<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chessvision</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #161512;
        --panel: #262421;
        --panel-secondary: #1e1d1a;
        --border: #363431;
        --text: #bababa;
        --text-strong: #ffffff;
        --accent: #35c555;
        --accent-hover: #2eb04b;
        --chesscom: #81b64c;
        --chesscom-hover: #73a443;
        --lichess: #3b82f6;
        --lichess-hover: #2563eb;
        --danger: #e5534b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 350px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-strong);
      }

      .brand img {
        width: 20px;
        height: 20px;
        display: block;
      }

      .btn {
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: #0d1a10;
        font-weight: 600;
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: var(--accent-hover);
      }

      .btn-chesscom {
        background: var(--chesscom);
        color: #ffffff;
      }

      .btn-chesscom:hover {
        background: var(--chesscom-hover);
      }

      .btn-lichess {
        background: var(--lichess);
        color: #ffffff;
      }

      .btn-lichess:hover {
        background: var(--lichess-hover);
      }

      .btn-secondary {
        background: var(--panel);
        color: var(--text-strong);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: #32302c;
      }

      main {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #status-message {
        padding: 10px;
        border-radius: 6px;
        background: var(--panel);
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
      }

      #status-message.error {
        color: var(--danger);
        background: rgba(229, 83, 75, 0.12);
        border: 1px solid rgba(229, 83, 75, 0.3);
      }

      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action-grid .btn {
        padding: 9px 8px;
        font-size: 13px;
      }

      .fen-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--panel-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
      }

      .fen-label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #888;
      }

      .fen-input-row {
        display: flex;
        gap: 6px;
      }

      #fen-display {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-strong);
        font-family: monospace;
        font-size: 11px;
        padding: 5px 8px;
        outline: none;
      }

      #copy-fen-btn {
        padding: 4px 8px;
        font-size: 11px;
      }

      .settings-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
      }

      .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .setting-item label {
        cursor: pointer;
      }

      select {
        background: var(--bg);
        color: var(--text-strong);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        outline: none;
      }

      input[type="checkbox"] {
        cursor: pointer;
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
      }

      #preview-section {
        margin-top: 4px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }

      #preview-toggle-btn {
        width: 100%;
        margin-bottom: 8px;
      }

      #lichess-frame {
        width: 100%;
        height: 380px;
        border: 1px solid var(--border);
        border-radius: 6px;
        display: none;
      }

      #lichess-frame.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icon.png" alt="chessvision" />
        <span>chessvision</span>
      </div>
      <button id="select-btn" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        Select Board
      </button>
    </header>

    <main>
      <div id="status-message">
        Drag a box around any chessboard on the page to scan and analyze it.
      </div>

      <div id="result-controls" style="display: none; flex-direction: column; gap: 10px;">
        <button id="open-editor-btn" class="btn" style="width: 100%; padding: 10px; font-size: 13px; background: #eab308; color: #1c1917; font-weight: 700;">
          🛠️ Edit Board (Lichess Editor)
        </button>

        <div class="action-grid">
          <button id="open-chesscom-btn" class="btn btn-chesscom">
            ♟️ Analyze (Chess.com)
          </button>
          <button id="open-lichess-btn" class="btn btn-lichess">
            🐴 Analyze (Lichess)
          </button>
        </div>

        <div class="fen-container">
          <div class="fen-label-row">
            <span>Detected FEN</span>
            <span id="orientation-indicator">White</span>
          </div>
          <div class="fen-input-row">
            <input type="text" id="fen-display" readonly />
            <button id="copy-fen-btn" class="btn btn-secondary">Copy</button>
          </div>
        </div>

        <div id="preview-section">
          <button id="preview-toggle-btn" class="btn btn-secondary">
            Show Mini Board Preview
          </button>
          <iframe id="lichess-frame" allow="cross-origin-isolated"></iframe>
        </div>
      </div>

      <div class="settings-card">
        <div class="setting-item">
          <label for="open-mode-select">Default action</label>
          <select id="open-mode-select">
            <option value="editor">Board Editor (Sửa quân)</option>
            <option value="analysis">Analysis (Phân tích)</option>
          </select>
        </div>
        <div class="setting-item" id="site-setting-item">
          <label for="preferred-site">Analysis platform</label>
          <select id="preferred-site">
            <option value="chesscom">Chess.com</option>
            <option value="lichess">Lichess</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="auto-open-toggle">Auto-open tab after select</label>
          <input type="checkbox" id="auto-open-toggle" />
        </div>
      </div>
    </main>

    <script type="module" src="./src/popup.js"></script>
  </body>
</html>
